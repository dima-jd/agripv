map.on('load', () => {
  map.addSource('parcels', PARCELS_SOURCE);
  map.addLayer({ id:'parcels-fill', type:'fill', source:'parcels', 'source-layer':'parcels', paint:{ 'fill-color':colorExpr, 'fill-opacity':['interpolate',['linear'],['zoom'],7,0.85,13,0.6] } });
  map.addLayer({ id:'parcels-line', type:'line', source:'parcels', 'source-layer':'parcels', minzoom:12, paint:{ 'line-color':'#222', 'line-width':0.4, 'line-opacity':0.5 } });
  setTimeout(applyFilters);
  map.addLayer({ id:'parcels-selected', type:'line', source:'parcels', 'source-layer':'parcels', filter:['==',['get','id'],-1], paint:{ 'line-color':'#ff2d55', 'line-width':3 } });
});
map.on('click', 'parcels-fill', ev => { const f = ev.features[0]; if (f) showParcel(f.properties.id); });
map.on('mouseenter', 'parcels-fill', () => map.getCanvas().style.cursor = 'pointer');
map.on('mouseleave', 'parcels-fill', () => map.getCanvas().style.cursor = '');

async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }
const shardCache = new Map();
async function parcelDetail(id) {
  const shard = String(((Number(id) % 1024) + 1024) % 1024).padStart(4, '0');
  if (!shardCache.has(shard)) shardCache.set(shard, getJSON(`detail/${shard}.json`));
  return (await shardCache.get(shard))[id] ?? null;
}
function statusKey(d) { return d.status === 'eligible' ? d.screeningPriority : d.status; }

async function showParcel(id, fly = false) {
  const t = T[lang], d = await parcelDetail(id), box = document.getElementById('detail');
  box.hidden = false;
  if (!d) { box.innerHTML = `<p>${e(t.f.parcel)} ${e(id)}: ${e(t.f.unknown)}</p>`; return; }
  current = id;
  if (map.getLayer('parcels-selected')) map.setFilter('parcels-selected', ['==', ['get','id'], Number(id)]);
  if (fly && d.bbox) map.fitBounds([[d.bbox[0], d.bbox[1]], [d.bbox[2], d.bbox[3]]], { padding:80, maxZoom:16 });
  const crop = lang === 'he' ? d.crop : (d.cropNameEn || d.crop);
  const date = d.sourceRecordDate ? `${fmtDay(d.sourceRecordDate, d.sourceRecordDatePrecision)}${d.sourceRecordDatePrecision === 'year' ? ` (${t.f.yearOnly})` : ''}` : t.f.unknown;
  const why = d.reasons.length ? d.reasons.map(r => e(t.reasons[r] || r)).join('<br>') : '';
  const factors = d.screeningFactors ? d.screeningFactors.map(x => `<div class="factor"><span>${e(t.f.factors[x.code] || x.code)}</span><span>${x.points} / ${x.maxPoints}</span></div>`).join('') : '';
  const plans = d.planningOverlap?.plans?.length ? d.planningOverlap.plans.map(p => `${e(p.planNumber)} · ${(p.shareOfParcel * 100).toFixed(1)}% · ${e(p.statusMain)}`).join('<br>') : t.f.none;
  const cons = d.constraints?.length ? d.constraints.map(c => `${e((KINDS[c.kind] || [c.kind, c.kind])[lang === 'he' ? 1 : 0])}${c.name ? ' · ' + e(c.name) : ''}${c.shareOfParcel != null ? ' · ' + (c.shareOfParcel * 100).toFixed(1) + '%' : ''}${c.level === 'edge_contact' ? ' (' + e(t.f.edge) + ')' : ''}${c.level === 'crosses' ? ' (' + e(t.f.crosses) + ')' : ''}`).join('<br>') : t.f.none;
  box.innerHTML = `<div class="row"><strong><span class="sw" style="display:inline-block;vertical-align:-2px;background:${COLORS[statusKey(d)]}"></span> ${e(t.status[statusKey(d)])}</strong></div>
    <dl><dt>${e(t.f.parcel)}</dt><dd>${e(d.id)}</dd><dt>${e(t.f.crop)}</dt><dd>${e(crop ?? t.f.unknown)}</dd>
    <dt>${e(t.f.area)}</dt><dd>${d.areaDunam == null ? e(t.f.unknown) : e(d.areaDunam) + ' ' + e(t.f.dunam)}</dd>
    <dt>${e(t.f.locality)}</dt><dd>${e(d.locality ?? t.f.unknown)}</dd><dt>${e(t.f.authority)}</dt><dd>${e(d.authority ?? t.f.unknown)}</dd>
    <dt>${e(t.f.water)}</dt><dd>${e(d.waterType ?? t.f.unknown)}</dd><dt>${e(t.f.recorded)}</dt><dd>${e(date)}</dd>
    ${why ? `<dt>${e(t.f.why)}</dt><dd>${why}</dd>` : ''}
    ${d.screeningRank ? `<dt>${e(t.f.score)}</dt><dd>${e(d.screeningScore)} / 100</dd><dt>${e(t.f.rank)}</dt><dd>${d.screeningRank.toLocaleString(lang)}</dd>` : ''}
    <dt>${e(t.f.plans)}</dt><dd>${plans}</dd>${d.environment ? `<dt>${e(t.f.envT)}</dt><dd>${d.environment.sensitivityLevel ? e(d.environment.sensitivityLevel + ' — ' + t.f.envLevels[d.environment.sensitivityLevel]) : e(t.f.unknown)}${d.environment.sensitivityUnit ? ' · ' + e(t.f.envUnit) + ' ' + e(d.environment.sensitivityUnit) : ''}${d.environment.maxLevelInField && d.environment.maxLevelInField !== d.environment.sensitivityLevel ? ' · ' + e(t.f.envMax) + ' ' + d.environment.maxLevelInField : ''}${d.environment.landscapeDivision ? ' · ' + e(t.f.envDiv) + ' ' + (d.environment.landscapeDivisionLink ? `<a href="${e(d.environment.landscapeDivisionLink)}" target="_blank" rel="noopener noreferrer">${e(d.environment.landscapeDivision)}</a>` : e(d.environment.landscapeDivision)) : ''}<br><small>${e(t.f.envNote)}</small></dd>` : ''}${d.gridProximity ? `<dt>${e(t.f.gridT)}</dt><dd>${e(t.f.hvLine)} ${e(t.f.gridBands[d.gridProximity.hvLineBand])} · ${e(t.f.substation)} ${e(t.f.gridBands[d.gridProximity.substationBand])}<br><small>${e(t.f.gridNoteD)}</small></dd>` : ''}${d.terrain ? `<dt>${e(t.f.terrain)}</dt><dd>${e(t.f.slope)} ${d.terrain.slopeMeanDeg}° · ${e(t.f.slopeP90)} ${d.terrain.slopeP90Deg}° · ${e(t.f.northShare)} ${Math.round(d.terrain.northFacingShare * 100)}% · ${e(t.f.elev)} ${d.terrain.elevationMeanM} ${e(t.f.metre)}<br><small>${e(t.f.terrainNote)}</small></dd>` : ''}${d.solarResource ? `<dt>${e(t.f.solar)}</dt><dd>${d.solarResource.pvoutKwhPerKwpYear.toLocaleString(lang)} ${e(t.f.solarUnit)}<br><small>${e(t.f.solarNote)}</small></dd>` : ''}<dt>${e(t.f.constraints)}</dt><dd>${cons}<br><small>${e(t.f.constraintsNote)}</small></dd></dl>${factors}${d.inMap ? `<p><a href="../?lang=${lang}&layer=candidates&record=agripv-parcel-${encodeURIComponent(d.id)}">${e(t.openInMap)}</a></p>` : ''}`;
}

function fmtDay(v, precision) {
  if (!v) return null; const s = String(v).slice(0, 10); if (precision === 'year') return s.slice(0, 4);
  const d = new Date(s + 'T12:00:00Z'); return Number.isNaN(d.getTime()) ? s : d.toLocaleDateString(lang === 'he' ? 'he-IL' : 'en-GB', { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' });
}
var LEGEND_GROUPS = [['candidates', ['high','medium','early']], ['excluded', ['inside_agro_plan','protected_area','existing_agrivoltaic']], ['notEligible', ['covered','not_cultivated','too_small','too_large','missing_data','check_failed']]];
function renderLegend() {
  const t = T[lang], c = meta ? { ...meta.statusCounts, ...meta.bandCounts } : {};
  const row = k => `<div><span class="sw" style="background:${COLORS[k]}"></span><span>${e(t.status[k])}</span><span class="n">${c[k] != null ? c[k].toLocaleString(lang) : ''}</span></div>`;
  document.getElementById('legend').innerHTML = LEGEND_GROUPS.map(([g, keys]) => `<div class="lg"><p class="lg-title">${e(t.legendGroups[g])}</p>${keys.map(row).join('')}</div>`).join('');
}
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = T[lang][n.dataset.t]);
  document.title = T[lang].pageTitle;
  document.getElementById('back-map').href = '../?lang=' + lang; document.getElementById('to-spfi').href = 'https://spfi.co.il/' + lang + '/';
  document.getElementById('lang').textContent = T[lang].lang;
  document.getElementById('meta').textContent = meta ? T[lang].meta(meta) : '';
  renderLegend(); renderFilters(); search(); if (current != null) showParcel(current);
}
function search() {
  const q = norm(document.getElementById('q').value), ul = document.getElementById('results');
  if (!q) { ul.innerHTML = ''; return; }
  const items = [];
  if (/^\d+$/.test(q)) items.push({ label:`${T[lang].f.parcel} ${q}`, go:() => showParcel(Number(q), true) });
  for (const L of localities) { if (items.length >= 12) break; if (norm(L.locality).includes(q) || norm(L.authority).includes(q)) items.push({ label:`${L.locality ?? '—'} · ${L.authority ?? ''} (${L.eligible}/${L.parcels})`, go:() => map.fitBounds([[L.bbox[0], L.bbox[1]], [L.bbox[2], L.bbox[3]]], { padding:40, maxZoom:15 }) }); }
  ul.innerHTML = items.map((x, i) => `<li tabindex="0" role="option" data-i="${i}">${e(x.label)}</li>`).join('');
  ul.querySelectorAll('li').forEach(li => { const go = () => items[li.dataset.i].go(); li.onclick = go; li.onkeydown = ev => { if (ev.key === 'Enter') go(); }; });
}
document.getElementById('q').addEventListener('input', search);
document.getElementById('lang').onclick = () => { lang = lang === 'en' ? 'he' : 'en'; render(); };
render();
Promise.all([getJSON('meta.json'), getJSON('localities.json')]).then(([m, l]) => { meta = m; localities = l; render(); }).catch(err => { document.getElementById('meta').textContent = String(err); });

// ---- Filters (candidate fields only; tile properties sl, pv, es, gl, gs, cf) ----
var FILTERS, UPPER, fstate; // assigned lazily: render() runs before this part of the script
function initFilters() { if (fstate) return; FILTERS = { slope:[['',null],['20','≤ 2°'],['50','≤ 5°']], solar:[['',null],['1650','≥ 1,650'],['1750','≥ 1,750']], sens:[['',null],['3',3],['4',4]], line:[['',null],['0','lt1km'],['1','1to3km'],['2','3to10km']], sub:[['',null],['0','lt5km'],['1','5to15km']] }; UPPER = { lt1km:1, '1to3km':3, '3to10km':10, lt5km:5, '5to15km':15 }; fstate = { slope:'', solar:'', sens:'', line:'', sub:'', flags:false }; }
function filterExpr() { initFilters();
  const c = [['==', ['get','st'], 'eligible']];
  if (fstate.slope) c.push(['<=', ['coalesce', ['get','sl'], 1e9], Number(fstate.slope)]);
  if (fstate.solar) c.push(['>=', ['coalesce', ['get','pv'], -1], Number(fstate.solar)]);
  if (fstate.sens) c.push(['<=', ['coalesce', ['get','es'], 99], Number(fstate.sens)]);
  if (fstate.line) c.push(['<=', ['coalesce', ['get','gl'], 99], Number(fstate.line)]);
  if (fstate.sub) c.push(['<=', ['coalesce', ['get','gs'], 99], Number(fstate.sub)]);
  if (fstate.flags) c.push(['!', ['has', 'cf']]);
  return ['all', ...c];
}
function activeFilters() { initFilters(); return ['slope','solar','sens','line','sub'].filter(k => fstate[k]).length + (fstate.flags ? 1 : 0); }
function applyFilters() {
  if (!map.getLayer('parcels-fill')) return;
  const f = activeFilters() ? filterExpr() : null;
  map.setFilter('parcels-fill', f); map.setFilter('parcels-line', f);
  updateFilterStatus();
}
function updateFilterStatus() {
  const box = document.getElementById('filter-status'); if (!box) return;
  const n = activeFilters(), t = T[lang].filters;
  if (!n) { box.textContent = ''; return; }
  const ids = new Set(map.queryRenderedFeatures({ layers:['parcels-fill'] }).map(f => f.properties.id));
  box.textContent = t.active(n) + ' · ' + t.inView(ids.size);
}
function renderFilters() { initFilters();
  const t = T[lang].filters, box = document.getElementById('filters'), open = box.open || activeFilters() > 0;
  const opt = (key, labelFor) => FILTERS[key].map(([v, x]) => `<option value="${v}"${fstate[key] === v ? ' selected' : ''}>${e(v === '' ? t.any : labelFor(x))}</option>`).join('');
  box.innerHTML = `<summary>${e(t.title)}</summary><p class="muted">${e(t.intro)}</p>
    <label>${e(t.slope)}<select data-f="slope">${opt('slope', x => t.upTo + ' ' + x.replace('≤ ', ''))}</select></label>
    <label>${e(t.solar)}<select data-f="solar">${opt('solar', x => t.atLeast + ' ' + x.replace('≥ ', ''))}</select></label>
    <label>${e(t.sens)}<select data-f="sens">${opt('sens', x => t.levelUpTo(x))}</select></label>
    <label>${e(t.line)}<select data-f="line">${opt('line', x => t.upTo + ' ' + UPPER[x] + ' ' + t.km)}</select></label>
    <label>${e(t.sub)}<select data-f="sub">${opt('sub', x => t.upTo + ' ' + UPPER[x] + ' ' + t.km)}</select></label>
    <label class="check"><input type="checkbox" data-f="flags"${fstate.flags ? ' checked' : ''}> ${e(t.flags)}</label>
    <button type="button" id="filter-reset">${e(t.reset)}</button><p id="filter-status" aria-live="polite"></p><p class="muted">${e(t.gridNote)}</p>`;
  box.open = open;
  box.querySelectorAll('select[data-f]').forEach(sel => sel.addEventListener('change', () => { fstate[sel.dataset.f] = sel.value; applyFilters(); }));
  box.querySelector('input[data-f=flags]').addEventListener('change', ev => { fstate.flags = ev.target.checked; applyFilters(); });
  box.querySelector('#filter-reset').addEventListener('click', () => { Object.assign(fstate, { slope:'', solar:'', sens:'', line:'', sub:'', flags:false }); renderFilters(); applyFilters(); });
  updateFilterStatus();
}
map.on('moveend', updateFilterStatus);
map.on('idle', () => { if (activeFilters()) updateFilterStatus(); });
</script>
</body>
